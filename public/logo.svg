<!--
  The favicon carries the same mark as Logo.tsx: three round-topped arches on
  one baseline, the first one crossed. Keep the two in step — the paths here
  are the component's geometry at 0.72 inside its tile, the ratio the header
  uses.

  The tile violet is written out rather than taken from brand-600: that ramp
  inverts to pale lilac in the dark theme, which would take a white mark down
  to 2.34:1. On this ground it is 6.38:1, the same in both themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#6C4AB6"/>
  <g transform="translate(14 14) scale(0.72)"
     stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 7.5 88 H 92.5"/>
    <path d="M 7.5 88 V 67 A 11 11 0 0 1 29.5 67 V 88 Z" fill="#FFFFFF"/>
    <path d="M 34.5 88 V 45 A 12 12 0 0 1 58.5 45 V 88 Z"/>
    <path d="M 63.5 88 V 26.5 A 14.5 14.5 0 0 1 92.5 26.5 V 88 Z"/>
  </g>
</svg>
