<!--
  The favicon carries the same mark as Logo.tsx: three pointed two-centred
  arches on one baseline, the first one crossed. Keep the two in step — the
  paths here are the component's geometry at 0.72 inside its tile, which is
  the ratio the header uses.

  The tile is #3F2B6A, not brand-600: brand-600 inverts to pale lilac in the
  dark theme and the amber arch would fall to 1.37:1 on it. Here white is
  10.5:1 and the amber 6.98:1, in either theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#3F2B6A"/>
  <g transform="translate(14 14) scale(0.72)"
     stroke="#F1F0F3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 5.5 88 H 94.5"/>
    <path d="M 5.5 88 V 70.99 A 15 15 0 0 1 13 58 A 15 15 0 0 1 20.5 70.99 V 88 Z"
          fill="#FFB86B" stroke="#FFB86B"/>
    <path d="M 33.5 88 V 57.19 A 21 21 0 0 1 44 39 A 21 21 0 0 1 54.5 57.19 V 88 Z"/>
    <path d="M 67.5 88 V 43.38 A 27 27 0 0 1 81 20 A 27 27 0 0 1 94.5 43.38 V 88 Z"/>
  </g>
</svg>
