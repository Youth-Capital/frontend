worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Password-reset links carry a token in their query string. Log only the
    # normalized path; never include the query string or Referer header.
    log_format path_only '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';
    access_log /dev/stdout path_only;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Only Vite's content-hashed files get long-lived caching. In particular,
    # index.html and unhashed public files must pick up the next release.
    map $uri $cache_control {
        default "no-cache";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control;
        # TLS/HSTS are managed by the edge proxy. Do not impose a blanket CSP
        # here: the existing UI has an inline theme script and inline styles.

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ^~ /fonts/ {
            try_files $uri =404;
        }

        location ^~ /illustrations/ {
            try_files $uri =404;
        }

        # These requests belong to Django/the edge, never the SPA fallback.
        location ~ ^/(api|django-admin|static|media)(/|$) {
            return 404;
        }

        location ~ /\. {
            return 404;
        }

        # Missing public files must not return the SPA document with a 200.
        location ~* \.(css|js|mjs|json|png|jpe?g|gif|webp|svg|ico|avif|woff2?|ttf|otf|eot|map|webmanifest)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
